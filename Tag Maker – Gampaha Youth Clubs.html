<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tag Maker – Gampaha Youth Clubs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3f3;--panel:#fff;--ink:#241a1c;--mute:#6f6366;--line:#e2d9db;--accent:#9e1834;--accent-ink:#fff;--cell1:#e9e9e9;--cell2:#fafafa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171213;--panel:#221a1c;--ink:#f3eaec;--mute:#a89a9e;--line:#3a2e31;--accent:#d2456a;--cell1:#3a3a3a;--cell2:#2b2b2b}}
:root[data-theme="dark"]{--bg:#171213;--panel:#221a1c;--ink:#f3eaec;--mute:#a89a9e;--line:#3a2e31;--accent:#d2456a;--cell1:#3a3a3a;--cell2:#2b2b2b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:24px 18px 48px}
h1{font:700 34px/1.1 Oswald,Impact,"Arial Narrow",sans-serif;margin:0 0 4px;letter-spacing:.2px}
.sub{color:var(--mute);margin:0 0 22px;font-size:14px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
label{display:block;font-size:13px;font-weight:600;margin:0 0 5px}
.f{margin-bottom:16px}
input[type=text],textarea,select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:500 16px Oswald,system-ui,sans-serif;text-transform:uppercase}
textarea{resize:vertical;min-height:76px}
select{text-transform:none;font:14px system-ui,sans-serif}
.hint{font-size:12px;color:var(--mute);margin-top:4px}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid var(--line)}
button{width:100%;padding:13px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);font:700 17px Oswald,system-ui,sans-serif;letter-spacing:.5px;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font:500 14px system-ui,sans-serif;margin-top:8px;padding:9px}
.pv{border:1px solid var(--line);border-radius:8px;overflow:auto;padding:0}
.pv .inner{min-width:640px;background-image:linear-gradient(45deg,var(--cell1) 25%,transparent 25%,transparent 75%,var(--cell1) 75%),linear-gradient(45deg,var(--cell1) 25%,var(--cell2) 25%,var(--cell2) 75%,var(--cell1) 75%);background-size:20px 20px;background-position:0 0,10px 10px}
.pv.white .inner{background:#fff}.pv.black .inner{background:#000}.pv.photo .inner{background:linear-gradient(180deg,#3d7a4a,#7fb35a 60%,#c9a96b)}
canvas{display:block;width:100%;height:auto}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.row h2{font:500 18px Oswald,sans-serif;margin:0}
.row select{width:auto}
.note{font-size:12.5px;color:var(--mute);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<h1>Tag Maker</h1>
<p class="sub">Text type karanna – tag eka live wenas wenawa. Download karama transparent PNG ekak enawa.</p>
<div class="grid">
<div class="card">
<div class="f"><label for="main"><span class="sw" style="background:#FFD7A3"></span>Main text (Oswald)</label>
<textarea id="main" spellcheck="false">36th Gampaha Divisional
Youth Sports Fest</textarea>
<div class="hint">Line 2k wenas karanna Enter ahanna.</div></div>
<div class="f"><label for="date"><span class="sw" style="background:#fff"></span>Date (Oswald Bold)</label>
<input id="date" type="text" value="20/09/2026" maxlength="14" spellcheck="false"></div>
<div class="f"><label for="ph"><span class="sw" style="background:#FFAE12"></span>Photographer (Oswald Bold)</label>
<input id="ph" type="text" value="Don Shiwon" maxlength="26" spellcheck="false"></div>
<div class="f"><label for="size">Download size</label>
<select id="size"><option value="full">Full frame 4800 × 2700 (original size)</option><option value="crop">Tag only (cropped strip)</option></select></div>
<div class="f"><label for="fname">File name</label>
<input id="fname" type="text" value="tag" style="text-transform:none" spellcheck="false"></div>
<button id="dl" type="button">DOWNLOAD PNG</button>
<button id="reset" class="ghost" type="button">Reset to default</button>
</div>
<div class="card">
<div class="row"><h2>Preview</h2>
<select id="bg" aria-label="Preview background"><option value="">Transparent</option><option value="white">White</option><option value="black">Black</option><option value="photo">Photo-like</option></select></div>
<div class="pv" id="pv"><div class="inner"><canvas id="pc" width="4800" height="280"></canvas></div></div>
<p class="note">Background transparent. Tag eke pink/crimson band eka semi-transparent, adha photo ekak mata dammama original eke wagema penenawa.</p>
</div>
</div>
</div>

const COL={main:"#FFD7A3",date:"#FFFFFF",ph:"#FFAE12"};
const DEF={main:"36th Gampaha Divisional\nYouth Sports Fest",date:"20/09/2026",ph:"Don Shiwon"};
const $=id=>document.getElementById(id);
const W=4800,H=2700,CROP_Y=2380,CROP_H=280,CROP_X=60,CROP_W=4680;
const full=document.createElement("canvas");full.width=W;full.height=H;
const fx=full.getContext("2d");
const pc=$("pc"),px=pc.getContext("2d");
const img=new Image();let ready=false;
const FF='Oswald,"Arial Narrow",Impact,sans-serif';
function fit(text,weight,cap,maxW){
  fx.font=weight+" 100px "+FF;
  const asc=fx.measureText("H").actualBoundingBoxAscent||72;
  let size=cap/asc*100;
  fx.font=weight+" "+size+"px "+FF;
  const w=fx.measureText(text).width;
  if(w>maxW)size*=maxW/w;
  return size;
}
function put(text,weight,size,cx,base,color){
  fx.font=weight+" "+size+"px "+FF;fx.fillStyle=color;fx.textAlign="center";fx.textBaseline="alphabetic";
  fx.fillText(text,cx,base);
}
function render(){
  if(!ready)return;
  fx.clearRect(0,0,W,H);
  fx.drawImage(img,0,CROP_Y);
  /* main text */
  let lines=$("main").value.split("\n").map(s=>s.trim().toUpperCase()).filter(Boolean).slice(0,3);
  if(lines.length){
    const k=lines.length<=2?1:2/lines.length,cap=72*k,pitch=83*k,n=lines.length;
    let size=Math.min(...lines.map(l=>fit(l,500,cap,1400)));
    const top=2494-((n-1)*pitch+cap)/2;
    lines.forEach((l,i)=>put(l,500,size,2540,top+cap+i*pitch,COL.main));
  }
  /* date */
  put("DATE",400,fit("DATE",400,44,300),3588,2484,COL.date);
  const d=($("date").value.trim()||"").toUpperCase();
  if(d)put(d,700,fit(d,700,44,330),3588,2548,COL.date);
  /* photographer */
  put("PHOTOGRAPHED BY",700,fit("PHOTOGRAPHED BY",700,62,800),4237,2485,COL.ph);
  const p=($("ph").value.trim()||"").toUpperCase();
  if(p)put(p,700,fit(p,700,63,800),4237,2562,COL.ph);
  px.clearRect(0,0,pc.width,pc.height);
  px.drawImage(full,0,CROP_Y,W,CROP_H,0,0,W,CROP_H);
}
img.onload=()=>{ready=true;render()};img.src=BASE;
["main","date","ph"].forEach(i=>$(i).addEventListener("input",render));
$("bg").addEventListener("change",e=>{$("pv").className="pv "+e.target.value});
$("reset").addEventListener("click",()=>{$("main").value=DEF.main;$("date").value=DEF.date;$("ph").value=DEF.ph;render()});
if(document.fonts){
  Promise.all(["400","500","700"].map(w=>document.fonts.load(w+" 100px Oswald","36TH DATE"))).then(render).catch(()=>{});
  document.fonts.ready.then(render);
}
$("dl").addEventListener("click",async()=>{
  try{if(document.fonts)await Promise.all(["400","500","700"].map(w=>document.fonts.load(w+" 100px Oswald","36TH DATE")));}catch(e){}
  render();
  let src=full;
  if($("size").value==="crop"){
    src=document.createElement("canvas");src.width=CROP_W;src.height=CROP_H;
    src.getContext("2d").drawImage(full,CROP_X,CROP_Y,CROP_W,CROP_H,0,0,CROP_W,CROP_H);
  }
  src.toBlob(b=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b);
    a.download=(($("fname").value.trim()||"tag").replace(/[\\\/:*?"<>|]/g,"_"))+".png";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  },"image/png");
});
</script>
